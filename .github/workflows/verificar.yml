name: Verificar Python

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  sintaxe:
    name: Checar sintaxe dos arquivos .py
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar sintaxe
        run: |
          echo "Verificando todos os arquivos .py..."
          find . -name "*.py" | while read arquivo; do
            python -m py_compile "$arquivo" && echo "OK: $arquivo" || echo "ERRO: $arquivo"
          done
          # Falha o workflow se qualquer arquivo tiver erro de sintaxe
          find . -name "*.py" -exec python -m py_compile {} \;
